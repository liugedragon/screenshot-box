name: Bug report / 问题反馈
description: Something failed or behaved unexpectedly. / 操作遇到错误、结果不符合预期。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted examples. Do not upload private screenshots, databases, accounts, or keys.
        请使用合成或脱敏样例，不要上传私人截图、数据库、账号或密钥。
  - type: input
    id: version
    attributes:
      label: App version and package / 应用版本与来源
      placeholder: 0.1.3, installer / 安装包
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Displays and scaling / 显示器与缩放
      description: Resolution, scaling, and relative position of each monitor. / 每块屏幕的分辨率、缩放、相对位置。
      placeholder: "Main 2560×1440 at 125%, left monitor 1920×1080 at 100%. / 主屏 2560×1440 125%；左侧副屏 1920×1080 100%。"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 预期和实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error text or synthetic example / 错误原文或合成样例
      description: Optional. Remove personal information. / 可选。请移除个人内容。
