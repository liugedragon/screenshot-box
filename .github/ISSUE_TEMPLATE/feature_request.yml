name: 改进建议 / Feature request
description: 描述实际场景和你需要的改进。 / Describe a use case and a change that would help.
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        先看后续计划：https://github.com/liugedragon/screenshot-box/blob/main/ROADMAP.md
        Roadmap: https://github.com/liugedragon/screenshot-box/blob/main/ROADMAP.en.md
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
      description: 你在做什么，哪一步不方便？ / What are you doing, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: 现在的做法 / Current workaround
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改善 / Suggested change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案或参考 / Alternatives or references
