name: Feature request / 改进建议
description: Describe a use case and a change that would help. / 描述实际场景和你需要的改进。
title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Roadmap: https://github.com/liugedragon/screenshot-box/blob/main/ROADMAP.md
        后续计划：https://github.com/liugedragon/screenshot-box/blob/main/ROADMAP.zh-CN.md
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem / 使用场景与问题
      description: What are you doing, and what gets in the way? / 你在做什么，哪一步不方便？
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround / 现在的做法
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change / 希望如何改善
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or references / 其他方案或参考
