name: Windows candidate package (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.401'
          architecture: x64

      - name: Verify SDK and choose candidate version
        shell: pwsh
        run: |
          $expectedSdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          $actualSdk = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actualSdk -ne $expectedSdk) {
            throw "Expected .NET SDK $expectedSdk; found $actualSdk"
          }
          [xml]$project = Get-Content src/ScreenshotBox.App/ScreenshotBox.App.csproj -Raw
          $baseVersion = [string]$project.Project.PropertyGroup.Version
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a three-part app version; found $baseVersion"
          }
          "BUILD_VERSION=$baseVersion-ci.$env:GITHUB_RUN_ID" >> $env:GITHUB_ENV

      - name: Install verified Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $expectedHash = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $download
          $actualHash = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw 'Inno Setup download hash mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Inno Setup download has no valid Pyrsys B.V. signature.'
          }
          $installDir = Join-Path $env:GITHUB_WORKSPACE '.tools\inno'
          $process = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS',
            "/DIR=`"$installDir`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir 'ISCC.exe'))) {
            throw 'Inno Setup did not install ISCC.exe.'
          }

      - name: Fetch hash-checked OCR model
        shell: pwsh
        run: ./scripts/fetch-models.ps1

      - name: Build unsigned ZIP and installer
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Version $env:BUILD_VERSION
          ./scripts/installer.ps1 -Version $env:BUILD_VERSION

      - name: Verify outputs and record source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "ScreenshotBox-$env:BUILD_VERSION-win-x64"
          foreach ($name in @("$base.zip", "$base-setup.exe")) {
            $file = Join-Path 'artifacts' $name
            $sidecar = if ($name.EndsWith('.zip')) {
              Join-Path 'artifacts' "$base.sha256"
            } else {
              "$file.sha256"
            }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = "$actual  $name"
            if ((Get-Content -LiteralPath $sidecar -Raw).Trim() -ne $expected) {
              throw "Checksum mismatch: $name"
            }
          }
          [ordered]@{
            version = $env:BUILD_VERSION
            sourceCommit = $env:GITHUB_SHA
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            dotnetSdk = (dotnet --version)
            innoSetup = '7.1.0'
            signed = $false
          } | ConvertTo-Json | Set-Content artifacts/BUILD-PROVENANCE.json -Encoding UTF8

      - name: Upload unsigned candidate and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-windows-${{ github.run_id }}
          path: |
            artifacts/*-win-x64-setup.exe
            artifacts/*-win-x64-setup.exe.sha256
            artifacts/*-win-x64.zip
            artifacts/*-win-x64.sha256
            artifacts/BUILD-PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
